[package]
name = "partyscreen"
version = "1.0.7"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
anyhow = "1"
bytes = "1"
futures-util = "0.3"
opus = "0.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
webrtc = "=0.17.2"
jpeg-encoder = "0.7.1"
base64 = "0.23.1"

[target."cfg(windows)".dependencies]
cpal = "0.18"
openh264 = "0.9"
windows-capture = "2"

[target.'cfg(target_os = "macos")'.dependencies]
openh264 = "0.9"
screencapturekit = { version = "11", features = ["macos_14_0"] }

[profile.release]
codegen-units = 1
lto = "thin"
