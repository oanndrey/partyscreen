[package]
name = "tela-host"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
cpal = "0.18"
eframe = { version = "0.37.0", features = ["persistence"] }
futures-util = "0.3.34"
opus = "0.4"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
webrtc = "=0.17.2"

[target."cfg(windows)".dependencies]
openh264 = "0.9"
windows-capture = "2"

[target.'cfg(target_os = "macos")'.dependencies]
openh264 = "0.9"
screencapturekit = "11"

[build-dependencies]
winresource = "0.1.34"
